<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="theme-color" content="#fff9f5">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="D & T">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="msapplication-TileColor" content="#fff9f5">
  <meta name="msapplication-TileImage" content="assets/pwa-icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/pwa-icon-180.png">
  <title>D & T | 时间胶囊</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-prep" data-page="capsules">
  <canvas id="skyCanvas" aria-hidden="true"></canvas>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="情侣主页">D & T</a>
    <nav class="site-nav" aria-label="页面导航">
      <a href="index.html" data-nav="home">首页</a>
      <a href="story.html" data-nav="story">故事</a>
      <a href="notes.html" data-nav="notes">碎碎念</a>
      <a href="album.html" data-nav="album">相册</a>
      <a href="travel.html" data-nav="travel">旅行地图</a>
      <a href="wishes.html" data-nav="wishes">愿望</a>
      <a href="daily.html" data-nav="capsules">时间胶囊</a>
      <button class="logout-button" type="button" data-logout>编辑</button>
    </nav>
  </header>
  <main class="page-main">
    <section class="page-hero">
      <p class="eyebrow">Time Capsule</p>
      <h1>时间胶囊</h1>
      <p>写给未来 twc 的信，设定一个开启时刻，让想说的话在未来准时抵达。</p>
    </section>
    <section class="section capsule-section">
      <form class="content-compose capsule-compose" data-capsule-form>
        <div class="content-compose-head">
          <strong>写一封给未来的信</strong>
          <p data-capsule-message role="status"></p>
        </div>
        <div class="content-compose-fields">
          <label>
            <span>信件标题</span>
            <input name="title" type="text" maxlength="48" placeholder="例如：给一年后的我们">
          </label>
          <label>
            <span>开启时间</span>
            <input name="unlockAt" type="datetime-local" required>
          </label>
          <label class="content-compose-wide">
            <span>信件内容</span>
            <textarea name="text" rows="6" maxlength="1000" placeholder="把想对未来 twc 说的话写在这里…"></textarea>
          </label>
          <label class="content-compose-wide" data-edit-time-field hidden>
            <span>编辑时间</span>
            <input name="updatedAt" type="datetime-local">
          </label>
          <div class="content-compose-actions">
            <button type="submit">封存时间胶囊</button>
            <button class="ghost-action" type="button" data-capsule-cancel hidden>取消编辑</button>
            <button class="danger-action" type="button" data-capsule-delete-entry hidden>删除</button>
          </div>
        </div>
      </form>
      <div class="capsule-grid" data-capsule-list></div>
    </section>
  </main>
  <footer class="site-footer">
    <p>Made for <span id="footerNameA">D</span> &amp; <span id="footerNameB">T</span></p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
