[build]
  publish = "."
  functions = "netlify/functions"

  [build.environment]
    # 这几个值本就是公开/应出现在前端，不必当作密钥扫描：
    # - SUPABASE_URL / SUPABASE_BUCKET 出现在照片 URL 与代码默认值里
    # - ACCESS_CODE / EDIT_CODE 是设计上放前端的登录码
    # 真正的敏感密钥 SUPABASE_SERVICE_ROLE_KEY 不在此列，仍受扫描保护。
    SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_BUCKET,ACCESS_CODE,EDIT_CODE"
    SECRETS_SCAN_OMIT_PATHS = "data/site-state.json"

[[redirects]]
  from = "/api/images"
  to = "/.netlify/functions/images"
  status = 200

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/state"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/diag"
  to = "/.netlify/functions/diag"
  status = 200
