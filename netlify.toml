[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/images"
  to = "/.netlify/functions/images"
  status = 200

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/state"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200
