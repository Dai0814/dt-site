<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="theme-color" content="#fff9f5">
  <meta name="format-detection" content="telephone=no">
  <title>D & T | 登录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-prep" data-page="login">
  <canvas id="skyCanvas" aria-hidden="true"></canvas>

  <main class="login-page">
    <section class="login-panel" aria-label="情侣主页登录">
      <p class="eyebrow" id="loginModeEyebrow">OUR ROMANTIC SPACE.</p>
      <h1>D & T</h1>
      <p id="loginModeDescription">请输入打开主页的暗号。</p>

      <form class="login-form" id="loginForm">
        <label>
          <span id="loginModeLabel">登录暗号</span>
          <input id="loginCode" type="password" inputmode="numeric" autocomplete="current-password">
        </label>
        <p class="login-error" id="loginError" role="alert"></p>
        <button id="loginModeSubmit" type="submit">进入主页</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
